
services:
  frontend:
    image: shamiltp/pm-tool-frontend:latest
    ports:
      - "3077:80"
    depends_on:
      - calendar-backend
      - product-key-backend
    restart: unless-stopped

  calendar-backend:
    image: shamiltp/pm-tool-calendar:latest
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - DB=${DB}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - REDIRECT_URI=${REDIRECT_URI}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongodb
    restart: unless-stopped

  product-key-backend:
    image: shamiltp/pm-tool-product-key:latest
    ports:
      - "5002:5000"
    environment:
      - PORT=5000
      - DB=${DB}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - REDIRECT_URI=${REDIRECT_URI}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongodb
    restart: unless-stopped

  core-backend:
    image: shamiltp/pm-tool-core-backend:latest
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - DATABASE_URL=postgresql://postgres:mysecretpassword@postgresql:5432/pm-tool
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    depends_on:
      - postgresql
    restart: unless-stopped

  mongodb:
    image: mongo:${MONGO_VERSION:-4.4}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  postgresql:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: pm-tool
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  mongodb_data:
  postgres_data:
