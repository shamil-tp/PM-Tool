
services:
  frontend:
    image: shamiltp/pm-tool-frontend:latest
    ports:
      - "3077:80"
    depends_on:
      - calendar-backend
      - product-key-backend
    restart: unless-stopped

  calendar-backend:
    image: shamiltp/pm-tool-calendar:latest
    ports:
      - "5001:5000"
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  product-key-backend:
    image: shamiltp/pm-tool-product-key:latest
    ports:
      - "5002:5000"
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  core-backend:
    image: shamiltp/pm-tool-core-backend:latest
    ports:
      - "5003:5003"
    env_file:
      - .env
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:${MONGO_VERSION:-4.4}
    command: ["mongod", "--quiet"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgresql:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pm-tool
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pm-tool"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mongodb_data:
  postgres_data:
