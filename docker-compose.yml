services:
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - core-backend
      - calendar-backend
      - product-key-backend
    restart: unless-stopped
    networks:
      - pm-tool-network

  core-backend:
    container_name: core-backend
    build:
      context: ./backend/core
      dockerfile: Dockerfile
    ports:
      - "5000:5003"
    volumes:
      # Mount the entire root folder for the DevContainer workspace context
      - .:/workspace
    env_file:
      - path: .env
        required: false
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pm-tool-network

  calendar-backend:
    container_name: calendar-backend
    build:
      context: ./backend/calender
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    env_file:
      - path: .env
        required: false
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pm-tool-network

  product-key-backend:
    container_name: product-key-backend
    build:
      context: ./backend/product-key
      dockerfile: Dockerfile
    ports:
      - "5002:5000"
    env_file:
      - path: .env
        required: false
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pm-tool-network

  mongodb:
    container_name: mongodb
    image: mongo:4.4
    command: ["mongod", "--quiet"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - pm-tool-network

  postgresql:
    container_name: postgresql
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-default_password}
      POSTGRES_DB: pm-tool
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pm-tool"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - pm-tool-network

volumes:
  mongodb_data:
  postgres_data:

networks:
  pm-tool-network:
    driver: bridge
